name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (Next.js build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & build
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build

  judge:
    name: Judge service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps & test
        working-directory: services/judge-service-python
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/ -q

  fixlog-regressions:
    name: FIX_LOG source regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-level security regressions
        working-directory: services/judge-service-python
        run: |
          pip install pytest
          python -m pytest tests/test_fixlog_regressions.py -q --tb=short

