name: sandbox-adversarial

on:
  push:
    paths:
      - "services/judge-service-python/**"
      - ".github/workflows/sandbox-adversarial.yml"
  # 故意不加 paths 过滤：`adversarial` 是 main 的 required status check，
  # 而 GitHub 对「paths 未命中」的 workflow 不产生任何 check-run →
  # 不碰 services/judge-service-python/** 的 PR 会永久卡在 "Waiting for status to be reported"
  # （mergeable_state=blocked，其它检查全绿）。本 job 约 25s，PR 一律跑成本可接受。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/judge-service-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install seccomp toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev gcc strace

      - name: Trace real syscall sets & regenerate profiles (CI-validated lists)
        run: |
          chmod +x scripts/trace_syscalls.sh
          mkdir -p traces
          SB_TRACE_DIR=traces scripts/trace_syscalls.sh python -- python3 -c "print('trace')"
          echo 'int main(){return 0;}' > /tmp/t.c && gcc -O2 -o /tmp/t /tmp/t.c
          SB_TRACE_DIR=traces scripts/trace_syscalls.sh c -- /tmp/t
          SB_TRACE_DIR=traces scripts/trace_syscalls.sh node -- node -e "console.log('trace')"
          echo 'int main(){return 0;}' > /tmp/b.c
          SB_TRACE_DIR=traces scripts/trace_syscalls.sh build-c -- gcc -O2 -o /tmp/b /tmp/b.c
          python scripts/gen_whitelist.py --mode traces --trace-dir traces --out sandbox_profiles.h
          echo "--- traced syscall counts ---"
          wc -l traces/*.syscalls
          echo "--- node.syscalls ---"
          cat traces/node.syscalls
          echo "--- c vs committed header diff (informational) ---"
          git diff --stat -- sandbox_profiles.h || true

      - name: Cgroup diagnostics (delegation probe)
        run: |
          mount | grep cgroup || true
          echo "controllers: $(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo n/a)"
          echo "subtree_control: $(cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || echo n/a)"
          mkdir -p /sys/fs/cgroup/polycode-judge/diag 2>/dev/null && echo "mkdir: ok" || echo "mkdir: FAILED"
          ls -la /sys/fs/cgroup/polycode-judge/diag 2>/dev/null | head -6 || true
          (echo "+memory" > /sys/fs/cgroup/cgroup.subtree_control && echo "subtree write: ok") || echo "subtree write: FAILED ($?)"
          (echo max > /sys/fs/cgroup/polycode-judge/diag/memory.max 2>/dev/null && echo "memory.max write: ok") || echo "memory.max write: FAILED ($?)"
          rmdir /sys/fs/cgroup/polycode-judge/diag 2>/dev/null || true

      - name: Create sandbox user (uid 1002 / gid 1001)
        run: |
          sudo groupadd -g 1001 sandbox || true
          sudo useradd -u 1002 -g 1001 -M -s /usr/sbin/nologin sandbox || true
          id sandbox || true

      - name: Compile sandbox_netblock
        run: |
          sudo gcc -O2 -o /usr/local/bin/sandbox_netblock sandbox_netblock.c -lseccomp
          sudo chmod 755 /usr/local/bin/sandbox_netblock
          test -x /usr/local/bin/sandbox_netblock

      - name: NS jail debug probe (strace the failing exec)
        run: |
          set -x
          sudo gcc -O2 -o /tmp/sb_nb services/judge-service-python/sandbox_netblock.c -lseccomp
          NR=$(mktemp -d); WD=$(mktemp -d); chmod 755 $WD
          sudo -E env SB_NS=1 SB_NS_NEWROOT=$NR SB_NS_DIRS_RO="/usr,/lib,/lib64,/bin" \
            SB_UID=1002 SB_GID=1001 SANDBOX_NETBLOCK=/tmp/sb_nb PATH=$PATH \
            strace -f -o /tmp/ns.log /tmp/sb_nb /usr/bin/python3 -c "print('nsok')" || true
          grep -E "execve|chroot|mount" /tmp/ns.log | tail -15 || true
          echo "--- jail contents ---"
          sudo ls $NR/usr/bin 2>/dev/null | head -4 || true
          sudo ls -la $NR/lib64 2>/dev/null | head -5 || true
          sudo ls -la $NR/lib 2>/dev/null | head -5 || true
          rm -rf $NR $WD /tmp/ns.log

      - name: Install pytest
        run: pip install pytest

      - name: Run adversarial suite as root
        env:
          SANDBOX_HELPER: ${{ github.workspace }}/services/judge-service-python/app/sandbox_helper.py
          SANDBOX_NETBLOCK: /usr/local/bin/sandbox_netblock
          SB_SANDBOX_UID: "1002"
          SB_SANDBOX_GID: "1001"
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" python -m pytest tests/sandbox_adversarial -q --tb=short -rA | tee /tmp/sb_pytest.txt
          # 防假绿：必须有明确的 passed 计数，且 fail-closed/文档测试至少其一执行
          if ! grep -E '[1-9][0-9]* passed' /tmp/sb_pytest.txt; then
            echo "HARD FAIL: no pytest passed summary"
            exit 1
          fi
          # 至少 4 个 passed（含元数据 + fail-closed 等），避免 0 用例也算过
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/sb_pytest.txt | head -1 | awk '{print $1}')
          echo "PASSED_COUNT=${PASSED}"
          if [ "${PASSED:-0}" -lt 4 ]; then
            echo "HARD FAIL: expected >=4 passed, got ${PASSED}"
            exit 1
          fi
