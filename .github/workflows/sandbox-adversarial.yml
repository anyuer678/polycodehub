name: sandbox-adversarial

on:
  push:
    paths:
      - "services/judge-service-python/**"
      - ".github/workflows/sandbox-adversarial.yml"
  # 故意不加 paths 过滤：`adversarial` 是 main 的 required status check，
  # 而 GitHub 对「paths 未命中」的 workflow 不产生任何 check-run →
  # 不碰 services/judge-service-python/** 的 PR 会永久卡在 "Waiting for status to be reported"
  # （mergeable_state=blocked，其它检查全绿）。本 job 约 25s，PR 一律跑成本可接受。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/judge-service-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install seccomp toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev gcc

      - name: Create sandbox user (uid 1002 / gid 1001)
        run: |
          sudo groupadd -g 1001 sandbox || true
          sudo useradd -u 1002 -g 1001 -M -s /usr/sbin/nologin sandbox || true
          id sandbox || true

      - name: Compile sandbox_netblock
        run: |
          sudo gcc -O2 -o /usr/local/bin/sandbox_netblock sandbox_netblock.c -lseccomp
          sudo chmod 755 /usr/local/bin/sandbox_netblock
          test -x /usr/local/bin/sandbox_netblock

      - name: Install pytest
        run: pip install pytest

      - name: Run adversarial suite as root
        env:
          SANDBOX_HELPER: ${{ github.workspace }}/services/judge-service-python/app/sandbox_helper.py
          SANDBOX_NETBLOCK: /usr/local/bin/sandbox_netblock
          SB_SANDBOX_UID: "1002"
          SB_SANDBOX_GID: "1001"
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" python -m pytest tests/sandbox_adversarial -q --tb=short -rA | tee /tmp/sb_pytest.txt
          # 防假绿：必须有明确的 passed 计数，且 fail-closed/文档测试至少其一执行
          if ! grep -E '[1-9][0-9]* passed' /tmp/sb_pytest.txt; then
            echo "HARD FAIL: no pytest passed summary"
            exit 1
          fi
          # 至少 4 个 passed（含元数据 + fail-closed 等），避免 0 用例也算过
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/sb_pytest.txt | head -1 | awk '{print $1}')
          echo "PASSED_COUNT=${PASSED}"
          if [ "${PASSED:-0}" -lt 4 ]; then
            echo "HARD FAIL: expected >=4 passed, got ${PASSED}"
            exit 1
          fi
